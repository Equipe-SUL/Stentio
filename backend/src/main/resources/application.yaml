spring:
  docker:
    compose:
      enabled: false

  application:
    name: stentio

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_USER:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME:root}:${MONGO_INITDB_ROOT_PASSWORD:changeme}@localhost:${MONGO_PORT:27017}/admin?authSource=admin

  rabbitmq:
    host: localhost
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:myuser}
    password: ${RABBITMQ_DEFAULT_PASS:changeme}

management:
  health:
    mongodb:
      enabled: false
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
api:
  security:
    token:
      secret: ${JWT_SECRET:minha-chave-secreta-super-longa-para-jwt-stentio-2026}

app:
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:false}
      email: ${ADMIN_INITIAL_EMAIL:}
      password: ${ADMIN_INITIAL_PASSWORD:}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  cors:
    allowed-origins: http://localhost:8080,http://localhost:8081,http://localhost:19006