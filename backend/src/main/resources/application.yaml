spring:
  docker:
    compose:
      enabled: false
  # desabilitar as configurações automáticas do MongoDB enquanto não é usado
  # para silenciar o erro de conexão com o MongoDB no console
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

  application:
    name: stentio

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: ${APP_SECURITY_USER:admin}
      password: ${APP_SECURITY_PASSWORD:admin123}
      roles: ADMIN

  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/admin?authSource=admin

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}

management:
  health:
    mongodb:
      enabled: false
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
api:
  security:
    token:
      secret: ${JWT_SECRET}

app:
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:false}
      email: ${ADMIN_INITIAL_EMAIL:-admin@stentio.com}
      password: ${ADMIN_INITIAL_PASSWORD:}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:19006