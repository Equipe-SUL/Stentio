[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafa2-bit", email = "faelbc10@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "groq>=1.7.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.57",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pyright]
extraPaths = ["app"]
