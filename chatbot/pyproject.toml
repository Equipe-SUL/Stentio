[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafa2-bit", email = "faelbc10@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "groq>=1.7.0",
    "psycopg>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.57",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
