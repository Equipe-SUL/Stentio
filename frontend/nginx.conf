events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DNS interno do Docker. Com o endereço em variável no proxy_pass, o nginx resolve o
    # nome a cada requisição (respeitando o valid=) em vez de uma vez só na subida: quando
    # core ou auth são recriados e mudam de IP, o front não fica preso no IP antigo (502)
    # e o nginx sobe mesmo com algum serviço ainda fora do ar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Sem URI depois do host, o proxy_pass com variável repassa o caminho original
        # inteiro, exatamente como o proxy_pass com o nome fixo fazia.
        set $up_core    core:8080;
        set $up_auth    auth:8080;
        set $up_email   email-service:8083;
        set $up_import  import-service:8000;
        set $up_chatbot chatbot-service:8000;

        location /api/v1/importacoes/configuracao {
            proxy_pass http://$up_import;
            proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }    

        location ^~ /upload-csv {
            client_max_body_size 11m;
            proxy_pass http://$up_import;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/public/usuarios {
            proxy_pass http://$up_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/usuarios {
            proxy_pass http://$up_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/eu {
            proxy_pass http://$up_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui {
            proxy_pass http://$up_auth;
        }

        location /v3/api-docs {
            proxy_pass http://$up_auth;
        }

        location /api/v1/empresa {
            proxy_pass http://$up_email;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/smtp {
            proxy_pass http://$up_email;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/emails {
            proxy_pass http://$up_email;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Token do link não deve aparecer no access log nem no Referer.
        location = /orcamento {
            access_log off;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            try_files /orcamento.html =404;
        }

        location = /orcamento.html {
            access_log off;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /api/v1/public/orcamentos {
            access_log off;
            proxy_pass http://$up_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ia/chatbot {
            proxy_pass http://$up_chatbot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            proxy_pass http://$up_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri.html $uri/index.html $uri $uri/ /index.html;
        }
    }
}
