spring:
  docker:
    compose:
      enabled: false
  # desabilitar as configurações automáticas do MongoDB enquanto não é usado
  # para silenciar o erro de conexão com o MongoDB no console
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

  application:
    name: stentio-core

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stentio}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Carrega coleções LAZY (tipos, preços, idiomas) em lotes, evitando uma consulta por recurso na listagem.
        default_batch_fetch_size: 50

  data:
    web:
      pageable:
        # Impede requisições como ?size=1000000, que carregariam a tabela inteira em memória.
        max-page-size: 100
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/admin?authSource=admin

  servlet:
    multipart:
      # CA.2: limites do upload. Acima disso o Spring corta antes de chegar ao controller.
      max-file-size: ${APP_ARQUIVO_TAMANHO_MAXIMO:10MB}
      max-request-size: ${APP_REQUISICAO_TAMANHO_MAXIMO:50MB}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:myuser}
    password: ${RABBITMQ_PASS:changeme}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  health:
    mongodb:
      enabled: false
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info

api:
  security:
    token:
      secret: ${JWT_SECRET:dev-secret}

app:
  seed:
    test-data:
      enabled: ${SEED_TEST_DATA_ENABLED:false}
  arquivos:
    # Em Docker aponta para o volume; fora dele cai em ./uploads dentro do módulo Core.
    diretorio: ${APP_ARQUIVOS_DIRETORIO:uploads}
    extensoes-permitidas: ${APP_ARQUIVOS_EXTENSOES:pdf,doc,docx,odt,rtf,txt,xls,xlsx,ppt,pptx,jpg,jpeg,png}
    maximo-por-solicitacao: ${APP_ARQUIVOS_MAXIMO:10}
  orcamentos:
    token-validade: ${ORCAMENTO_TOKEN_VALIDADE:PT120H}
    url-consulta-publica: ${ORCAMENTO_URL_CONSULTA_PUBLICA:http://localhost:8082/api/v1/public/orcamentos}
    outbox:
      enabled: ${ORCAMENTO_OUTBOX_ENABLED:true}
      intervalo-ms: ${ORCAMENTO_OUTBOX_INTERVALO_MS:5000}
      retry-segundos: ${ORCAMENTO_OUTBOX_RETRY_SEGUNDOS:30}
      confirm-timeout-segundos: ${ORCAMENTO_OUTBOX_CONFIRM_TIMEOUT_SEGUNDOS:5}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:19006}

springdoc:
  api-docs:
    enabled: ${ENABLE_DOCS:true}
  swagger-ui:
    enabled: ${ENABLE_DOCS:true}