services:
  front:
    build:
      context: ./frontend
    container_name: stentio-web
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - auth
      - core
      - email-service
    networks:
      - stentio-network
  auth:
    build:
      context: ./Auth
    container_name: stentio-auth
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-stentio}
      POSTGRES_PORT: "5432"
      AUTH_FLYWAY_BASELINE_VERSION: ${AUTH_FLYWAY_BASELINE_VERSION:-0}

      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: "27017"

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}

      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-longa-para-jwt-stentio-2026}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Lax}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8081,http://localhost:8082,http://localhost:19006}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
      APP_SECURITY_USER: ${APP_SECURITY_USER:-admin}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:-admin123}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailhog}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-false}
    ports:
      - "${SERVER_PORT:-8081}:8080"
    depends_on:
      - postgres
      - mongodb
      - rabbitmq
    networks:
      - stentio-network
  core:
    build:
      context: ./Core
    container_name: stentio-core
    environment:
      ENABLE_DOCS: ${ENABLE_DOCS:-false}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${CORE_POSTGRES_DB:-${POSTGRES_DB:-stentio}}
      POSTGRES_PORT: "5432"
      CORE_FLYWAY_BASELINE_VERSION: ${CORE_FLYWAY_BASELINE_VERSION:-0}

      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: "27017"

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}

      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-longa-para-jwt-stentio-2026}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8081,http://localhost:8082,http://localhost:19006}
      SEED_TEST_DATA_ENABLED: ${SEED_TEST_DATA_ENABLED:-false}

      # Link que vai no e-mail de aprovação do orçamento: a tela pública da US-15, servida
      # pelo nginx do front. O cliente é externo, então em qualquer ambiente que não seja a
      # máquina do dev isto precisa ser o endereço público.
      ORCAMENTO_URL_CONSULTA_PUBLICA: ${ORCAMENTO_URL_CONSULTA_PUBLICA:-http://localhost/orcamento}
      APP_PORTAL_RECURSO_URL: ${PORTAL_RECURSO_URL:-http://localhost/portal}
      APP_EQUIPE_EMAIL: ${EQUIPE_EMAIL:-operacoes@stentio.local}
      APP_ARQUIVOS_DIRETORIO: ${APP_ARQUIVOS_DIRETORIO:-/app/uploads}
      APP_ARQUIVOS_EXTENSOES: ${APP_ARQUIVOS_EXTENSOES:-pdf,doc,docx,odt,rtf,txt,xls,xlsx,ppt,pptx,jpg,jpeg,png}
      APP_ARQUIVOS_MAXIMO: ${APP_ARQUIVOS_MAXIMO:-10}
      APP_ARQUIVO_TAMANHO_MAXIMO: ${APP_ARQUIVO_TAMANHO_MAXIMO:-10MB}
      APP_REQUISICAO_TAMANHO_MAXIMO: ${APP_REQUISICAO_TAMANHO_MAXIMO:-50MB}
      ORCAMENTO_TOKEN_VALIDADE: ${ORCAMENTO_TOKEN_VALIDADE:-PT120H}
      ORCAMENTO_OUTBOX_ENABLED: ${ORCAMENTO_OUTBOX_ENABLED:-true}
      ORCAMENTO_OUTBOX_INTERVALO_MS: ${ORCAMENTO_OUTBOX_INTERVALO_MS:-5000}
      ORCAMENTO_OUTBOX_RETRY_SEGUNDOS: ${ORCAMENTO_OUTBOX_RETRY_SEGUNDOS:-30}
      ORCAMENTO_OUTBOX_CONFIRM_TIMEOUT_SEGUNDOS: ${ORCAMENTO_OUTBOX_CONFIRM_TIMEOUT_SEGUNDOS:-5}
      APP_ANEXOS_LIMITE_TOTAL_BYTES: ${APP_ANEXOS_LIMITE_TOTAL_BYTES:-10485760}

    ports:
      - "${CORE_SERVER_PORT:-8082}:8080"
    volumes:
      # Sem este volume os anexos das solicitações somem a cada rebuild do container.
      - core_uploads:${APP_ARQUIVOS_DIRETORIO:-/app/uploads}
    depends_on:
      - postgres
      - mongodb
      - rabbitmq
    networks:
      - stentio-network
  email-service:
    build:
      context: ./email-service
    container_name: stentio-email-service
    environment:
      SERVER_PORT: 8083
      SPRING_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/admin?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}

      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8081,http://localhost:8082,http://localhost:19006}
      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-longa-para-jwt-stentio-2026}

      APP_ANEXOS_DIRETORIO: ${APP_ARQUIVOS_DIRETORIO:-/app/uploads}
      APP_ANEXOS_LIMITE_TOTAL_BYTES: ${APP_ANEXOS_LIMITE_TOTAL_BYTES:-10485760}
    ports:
      - "${EMAIL_SERVICE_PORT:-8083}:8083"
    volumes:
      # US-13: mesmo volume do Core, somente leitura — o email-service lê os anexos da
      # solicitação para enviá-los no e-mail e nunca escreve nem apaga nada aqui.
      - core_uploads:${APP_ARQUIVOS_DIRETORIO:-/app/uploads}:ro
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - stentio-network
  import-service:
    build:
      context: ./import-service
    container_name: stentio-import-service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
    ports:
      - "8123:8000"
    depends_on:
      - postgres
    networks:
      - stentio-network
  chatbot-service:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: stentio-chatbot-service
    ports:
      - "${CHATBOT_PORT:-8000}:8000"
    environment:
      CHATBOT_DB_USER: ${CHATBOT_DB_USER:-agent}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD:?Defina CHATBOT_DB_PASSWORD no .env}
      DATABASE_URL: postgresql+psycopg://${CHATBOT_DB_USER:-agent}:${CHATBOT_DB_PASSWORD:?Defina CHATBOT_DB_PASSWORD no .env}@${POSTGRES_HOST:-postgres}:5432/${CORE_POSTGRES_DB:-${POSTGRES_DB:-stentio}}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/${MONGO_DB_NAME:-stentio_chatbot}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-stentio_chatbot}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-longa-para-jwt-stentio-2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      - postgres
      - mongodb
    networks:
      - stentio-network
    restart: unless-stopped
  postgres:
    image: postgres:18-trixie
    container_name: postgresdb-local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stentio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      CHATBOT_DB_USER: ${CHATBOT_DB_USER:-agent}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD:?Defina CHATBOT_DB_PASSWORD no .env}
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
      - ./init-chatbot-role.sh:/docker-entrypoint-initdb.d/10-chatbot-role.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - stentio-network
    restart: unless-stopped
  mongodb:
    # 8.0-ubi8-slim não sobe em kernels sem suporte a SIGSYS; 7.0 é compatível (ver 19cff60).
    image: mongo:7.0.5
    container_name: mongodb-local
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGO_PUBLISHED_PORT:-27017}:27017"
    networks:
      - stentio-network
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - stentio-network
    restart: unless-stopped
  mailhog:
    # dependência de desenvolvimento
    # para subir use: docker compose --profile dev [...]
    image: mailhog/mailhog
    container_name: email-service-mailhog
    networks:
      - stentio-network
    profiles:
      - dev
    ports:
      - "${MAILHOG_PORT_SMTP:-1025}:1025"
      - "${MAILHOG_PORT:-8025}:8025"
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: [ "tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN}", "--url", "http://front:80" ]
    depends_on:
      - front
    networks:
      - stentio-network
    restart: unless-stopped
    profiles:
      - deploy
volumes:
  core_uploads:
  mongo_data:
  postgres_data:
  rabbitmq_data:
networks:
  stentio-network:
    driver: bridge
