services:
  front:
    build:
      context: ./frontend
    container_name: stentio-web
    env_file:
      - .env
    ports:
      - "8080:80"
  auth:
    build:
      context: ./Auth
    container_name: stentio-auth
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-stentio}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}

      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-longa-para-jwt-stentio-2026}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Lax}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:19006}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    ports:
      - "${SERVER_PORT:-8081}:8080"
    depends_on:
      - postgres
      - mongodb
      - rabbitmq
    networks:
      - stentio-network

  core:
    build:
      context: ./Core
    container_name: stentio-core
    environment:
      ENABLE_DOCS: ${ENABLE_DOCS:-false}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${CORE_POSTGRES_DB:-${POSTGRES_DB:-stentio}}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}

      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-longa-para-jwt-stentio-2026}
    ports:
      - "${CORE_SERVER_PORT:-8082}:8080"
    depends_on:
      - postgres
      - mongodb
      - rabbitmq
    networks:
      - stentio-network

  email-service:
    build:
      context: ./email-service
    container_name: stentio-email-service
    environment:
      SERVER_PORT: 8083
      SPRING_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongodb:27017/admin?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}

      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:19006}
      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-longa-para-jwt-stentio-2026}
    ports:
      - "${EMAIL_SERVICE_PORT:-8083}:8083"
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - stentio-network

  postgres:
    image: postgres:18-trixie
    container_name: postgresdb-local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stentio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - stentio-network
    restart: unless-stopped

  mongodb:
    # 8.0-ubi8-slim não sobe em kernels sem suporte a SIGSYS; 7.0 é compatível (ver 19cff60).
    image: mongo:7.0.5
    container_name: mongodb-local
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - stentio-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-myuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - stentio-network
    restart: unless-stopped

  mailhog:
    # dependência de desenvolvimento
    # para subir use: docker compose --profile dev [...]
    image: mailhog/mailhog
    container_name: email-service-mailhog
    networks:
      - stentio-network
    profiles:
      - dev
    ports:
      - "${MAILHOG_PORT_SMTP:-1025}:1025"
      - "${MAILHOG_PORT:-8025}:8025"

volumes:
  mongo_data:
  postgres_data:
  rabbitmq_data:

networks:
  stentio-network:
    driver: bridge
